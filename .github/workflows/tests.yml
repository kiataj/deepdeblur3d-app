name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The suite is hermetic, but belt and braces: no runner should reach the
  # GitHub API just to run unit tests.
  DEBLUR3D_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: py${{ matrix.python }} / torch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported stack, the one the cu116 extra pins for Pascal cards.
          - python: "3.10"
            torch: "1.12.1"
            numpy: "numpy<2"
          # Current stack, what the cu128 extra installs.
          - python: "3.10"
            torch: "2.9.1"
            numpy: "numpy<2"
          # numpy 2 changed scalar promotion (NEP 50), which silently turned a
          # float32 volume into float64 once. Pinned as its own leg so it stays
          # covered rather than being incidental to whatever resolves.
          - python: "3.12"
            torch: "2.9.1"
            numpy: "numpy>=2"

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm and the git-describe fallback both need the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install torch (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install runtime dependencies
        # napari and Qt are deliberately excluded: core.py and cli.py import
        # neither, and the tests exercise only those. Installing Qt on a headless
        # runner buys nothing and costs minutes.
        run: pip install "${{ matrix.numpy }}" tifffile tqdm huggingface_hub platformdirs safetensors packaging

      - name: Report versions
        run: python -c "import torch, numpy; print('torch', torch.__version__, '| numpy', numpy.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Guards the packaging itself: a dynamic setuptools-scm version has broken
      # before, and a wheel built off a tag must carry that tag as its version.
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check the wheel is versioned from the tag, not a dirty tree
        run: |
          ls -l dist/
          if ls dist/*dirty*.whl >/dev/null 2>&1; then
            echo "wheel was built from a dirty tree"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
