[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "deblur3d-gui"
dynamic = ["version"]
description = "Napari GUI for DeepDeBlur3D with Hugging Face model auto-download"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kiarash Tajbakhsh" },
  { name = "Robert Zboray" },
]
license = { file = "LICENSE" }

dependencies = [
  "numpy>=1.22",
  "tifffile>=2023.2.3",
  "tqdm",
  "napari[qt]",
  "magicgui>=0.8",
  "superqt>=0.6",
  "matplotlib",
  "huggingface_hub>=0.23",
  "platformdirs>=3",
  "safetensors>=0.4",
]

[project.optional-dependencies]
# Pick the extra that matches your GPU generation; the code runs on any of them.
#
#   cu128  Volta through Blackwell (sm_70..sm_120). Needed for RTX 40/50-series,
#          which the old cu116 wheel has no kernels for.
#   cu116  Kepler through Ampere (sm_37..sm_86). Only for Pascal and older cards,
#          which torch dropped after 1.13.
cpu = [
  "torch>=1.12",
]
cu128 = [
  "torch>=2.7",
]
cu116 = [
  "torch==1.12.1+cu116",
  "torchvision==0.13.1+cu116",
]

[project.scripts]
deblur3d-gui = "deblur3d_app.gui:main"
deblur3d = "deblur3d_app.cli:main"

[tool.setuptools_scm]
# Version is derived from git tags; never edit it by hand. Tagged commits get the
# bare tag (v1.2.0 -> 1.2.0), later commits get 1.3.0.devN+g<hash>.
version_file = "src/deblur3d_app/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0+unknown"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deblur3d*", "deblur3d_app*"]
